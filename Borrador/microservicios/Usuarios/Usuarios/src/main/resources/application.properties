# Microservicio de Usuarios (src/main/resources/application.properties)
spring.application.name=Usuarios

# Puerto propio, distinto al de los otros servicios (pedidos 8081, pagos 8082, catalogo 8083), para poder levantar los dos a la vez
server.port=8084

# --- Base de datos (MySQL) ---
# createDatabaseIfNotExist crea el esquema solo si no existe.
# Usuario y clave se pueden cambiar con variables de entorno (DB_USER / DB_PASSWORD)
# para no dejar la clave real escrita en el repo.
spring.datasource.url=jdbc:mysql://localhost:3306/juegaya_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# update: crea y ajusta las tablas (usuario, sesion) al arrancar. Cómodo para desarrollar;
# en producción conviene "validate" o migraciones.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Alternativa sin MySQL (H2 en memoria) ---
# Para probar rápido sin instalar nada: comentar las 3 líneas spring.datasource.* de arriba
# y descomentar estas.
#spring.datasource.url=jdbc:h2:mem:usuarios;DB_CLOSE_DELAY=-1
#spring.datasource.username=sa
#spring.datasource.password=

# --- JWT ---
# Secreto para firmar los tokens (HS256, minimo 32 caracteres). Debe ser EL MISMO en Usuarios y en Gateway.
# En produccion define la variable de entorno JWT_SECRET y no dejes este valor por defecto.
jwt.secret=${JWT_SECRET:juegaya-clave-de-desarrollo-cambiala-en-produccion-2026}
