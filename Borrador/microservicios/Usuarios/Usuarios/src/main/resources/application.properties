spring.application.name=Usuarios
server.port=8084
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:juegaya_usuarios}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cuenta de administrador que se crea al primer arranque (cambiar la clave con ADMIN_PASSWORD)
juegaya.admin.email=${ADMIN_EMAIL:admin@juegaya.cl}
juegaya.admin.password=${ADMIN_PASSWORD:admin123}
