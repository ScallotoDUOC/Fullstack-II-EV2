# Perfil "h2": corre sin MySQL (archivo local ./data). Uso: -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:file:./data/catalogo;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
