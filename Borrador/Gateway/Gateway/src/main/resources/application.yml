server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ---- APIs ----
            - id: pedidos
              uri: ${PEDIDOS_URL:http://localhost:8081}
              predicates:
                - Path=/pedidos/**
            - id: pagos
              uri: ${PAGOS_URL:http://localhost:8082}
              predicates:
                - Path=/pagos/**
            - id: catalogo
              uri: ${CATALOGO_URL:http://localhost:8083}
              predicates:
                - Path=/api/catalogo/**
            - id: usuarios
              uri: ${USUARIOS_URL:http://localhost:8084}
              predicates:
                - Path=/api/auth/**

            # ---- Documentacion OpenAPI de cada servicio (para el Swagger unificado) ----
            # /docs/<servicio>/v3/api-docs  ->  <servicio>/v3/api-docs
            - id: pedidos-docs
              uri: ${PEDIDOS_URL:http://localhost:8081}
              predicates:
                - Path=/docs/pedidos/**
              filters:
                - RewritePath=/docs/pedidos/(?<segment>.*), /$\{segment}
            - id: pagos-docs
              uri: ${PAGOS_URL:http://localhost:8082}
              predicates:
                - Path=/docs/pagos/**
              filters:
                - RewritePath=/docs/pagos/(?<segment>.*), /$\{segment}
            - id: catalogo-docs
              uri: ${CATALOGO_URL:http://localhost:8083}
              predicates:
                - Path=/docs/catalogo/**
              filters:
                - RewritePath=/docs/catalogo/(?<segment>.*), /$\{segment}
            - id: usuarios-docs
              uri: ${USUARIOS_URL:http://localhost:8084}
              predicates:
                - Path=/docs/usuarios/**
              filters:
                - RewritePath=/docs/usuarios/(?<segment>.*), /$\{segment}

          # CORS abierto para desarrollo. En produccion limita los origenes.
          # Ojo: CORS se maneja SOLO aca. Si un microservicio tambien lo activa,
          # llegan headers Access-Control-* duplicados y el navegador rechaza la respuesta.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"

# Swagger UI unificado: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    urls:
      - name: Pedidos
        url: /docs/pedidos/v3/api-docs
      - name: Pagos
        url: /docs/pagos/v3/api-docs
      - name: Catalogo
        url: /docs/catalogo/v3/api-docs
      - name: Usuarios
        url: /docs/usuarios/v3/api-docs

# Secreto JWT: debe ser IGUAL al de Usuarios (variable de entorno JWT_SECRET en produccion)
jwt:
  secret: ${JWT_SECRET:juegaya-clave-de-desarrollo-cambiala-en-produccion-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    juegaYa.Gateway: INFO
    # Si algo falla, descomenta para ver a donde esta enviando el gateway cada peticion:
    # org.springframework.cloud.gateway: DEBUG
    # reactor.netty.http.client: DEBUG
